version: "3.9"

services:
  db:
    build: .
    container_name: "visiona-dev"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visiona}
      POSTGRES_USER: ${POSTGRES_USER:-visiona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visiona}
    ports:
      - "5432:${POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: