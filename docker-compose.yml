x-airflow-environment: &airflow-environment
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:-postgresql+psycopg2://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@database:5432/${POSTGRES_DB:-airflow_db}}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-local-dev-secret-key}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
  AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-False}
  PYTHONPATH: /opt/airflow
  POSTGRES_HOST: database
  POSTGRES_USER: ${POSTGRES_USER:-user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
  POSTGRES_DB: ${POSTGRES_DB:-airflow_db}
  POSTGRES_PORT: 5432


x-airflow-common: &airflow-common
  build: .
  image: custom-airflow-weather:latest  
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    <<: *airflow-environment
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data-ingestion:/opt/airflow/data-ingestion
    - ./api:/opt/airflow/api
    - ./api/config:/opt/airflow/config
  depends_on:
    airflow-permissions:
      condition: service_completed_successfully
    database:
      condition: service_healthy

services:
  airflow-permissions:
    image: apache/airflow:2.10.2
    user: "0:0"
    command: bash -c "mkdir -p /opt/airflow/logs /opt/airflow/plugins && chown -R $${AIRFLOW_UID}:0 /opt/airflow/logs /opt/airflow/plugins && chmod -R g+rwX /opt/airflow/logs /opt/airflow/plugins"
    environment:
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    volumes:
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

  database:
    build:
        context: .
        dockerfile: Dockerfile.db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-airflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./models/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db migrate && (airflow users create --username \"$${_AIRFLOW_WWW_USER_USERNAME}\" --firstname Admin --lastname User --role Admin --email admin@example.com --password \"$${_AIRFLOW_WWW_USER_PASSWORD}\" || true)"
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD:-airflow}
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  pgdata:
