name: Testes de Integracao Espaciais

on:
  push:
    branches:
      - main
      - dev
      - homolog
  pull_request:
    branches:
      - dev
      - homolog
      - main
  workflow_dispatch:

env:
  POSTGRES_USER: test
  POSTGRES_PASSWORD: test
  POSTGRES_DB: test_db
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  PYTHON_VERSION: '3.11'

jobs:
  test-spatial:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.6
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio sqlalchemy geoalchemy2 asyncpg

      - name: Setup test database
        run: python tests/setup_test_db.py --full

      - name: Run spatial integration tests
        run: pytest tests/integration/spatial/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio sqlalchemy geoalchemy2 asyncpg flake8

      - name: Lint tests
        run: flake8 tests/integration/spatial/ --max-line-length=120 --ignore=E501,W503