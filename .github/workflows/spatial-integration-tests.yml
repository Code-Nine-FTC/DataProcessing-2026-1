---
name: Spatial Integration Tests

on:
  push:
    branches: [main, devops]
  pull_request:
    branches: [main, devops]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set image name
        run: |
          echo "TEST_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/test-db" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build test database image
        run: docker build -f Dockerfile.test -t ${{ env.TEST_IMAGE }}:latest .

      - name: Start PostGIS container
        run: |
          docker run -d --name postgis-test \
            -p 5432:5432 \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test_db \
            ${{ env.TEST_IMAGE }}:latest
          for i in {1..30}; do
            if docker exec postgis-test pg_isready -U test -d test_db; then
              echo "PostGIS ready"; exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio psycopg2-binary alembic
          [ -f data-ingestion/requirements.txt ] && pip install -r data-ingestion/requirements.txt

      - name: Run migrations
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: alembic upgrade head

      - name: Run integration tests
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/api:${{ github.workspace }}/data-ingestion:${{ github.workspace }}/nlp_processor
        run: pytest tests/integration/spatial/ -v --tb=short -m "integration and not performance"

      - name: Run performance tests
        if: github.ref == 'refs/heads/main'
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/api:${{ github.workspace }}/data-ingestion:${{ github.workspace }}/nlp_processor
        run: pytest tests/integration/spatial/ -v --tb=short -m performance

      - name: Tag image with SHA
        if: github.event_name == 'push'
        run: docker tag ${{ env.TEST_IMAGE }}:latest ${{ env.TEST_IMAGE }}:${{ github.sha }}

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.TEST_IMAGE }}:latest
          docker push ${{ env.TEST_IMAGE }}:${{ github.sha }}
