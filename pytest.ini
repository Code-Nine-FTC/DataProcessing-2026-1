[pytest]
pythonpath = . data-ingestion
testpaths = tests
asyncio_mode = auto
# event_loop fixture em tests/integration/conftest.py cobre o scope session
markers =
    integration: Teste de integracao com banco real (Testcontainers)
    slow: Teste lento (ex: E2E)
    smoke: Smoke test apos deploy
    db: Teste que usa banco de dados (comum entre integration/slow)
