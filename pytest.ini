[pytest]
pythonpath = . data-ingestion
testpaths = tests
asyncio_mode = auto

markers =
    integration: spatial integration tests requiring PostGIS
    rf04: tests related to requirement RF-04 (spatial analytics)
    st_intersects: tests for ST_Intersects spatial function
    st_buffer: tests for ST_Buffer spatial function
    st_distance: tests for ST_Distance/ST_DWithin spatial functions
    st_area: tests for ST_Area/ST_Intersection spatial functions